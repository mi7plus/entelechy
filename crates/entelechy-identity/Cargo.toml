[package]
name = "entelechy-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Principals, authentication context, approval signatures and separation-of-duties checks"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
entelechy-artifacts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Only pulled in by the opt-in `ed25519` feature (real asymmetric signatures).
ed25519-dalek = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
default = []
# Replace the non-cryptographic MAC placeholder with real Ed25519 approval
# signatures (PRD 5.9, AU-2), behind the unchanged `KeyRing` interface. Opt-in so
# the default build stays dependency-light (CLAUDE.md invariant).
ed25519 = ["dep:ed25519-dalek", "dep:sha2", "dep:hex"]

[lints]
workspace = true
