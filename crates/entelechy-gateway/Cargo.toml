[package]
name = "entelechy-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Model/tool/secret gateway traits and adapters, including provider identity capture and fingerprint probes"
keywords.workspace = true
categories.workspace = true
homepage.workspace = true

[dependencies]
entelechy-ir = { workspace = true }
entelechy-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
wasmtime = { version = "49.0.0", default-features = false, features = ["runtime", "cranelift", "wat"], optional = true }
native-tls = { version = "0.2.18", optional = true }

[features]
# Real WASM execution engine for the sandbox (PRD 8.3/16.3). Off by default so the
# core workspace stays lean; enable with `--features wasm`.
wasm = ["dep:wasmtime"]
# OpenAI-compatible model gateway for self-hosted OSS models (Ollama/vLLM/
# llama.cpp/LM Studio/LocalAI). Dependency-free (std::net); enable with
# `--features openai`.
openai = []
# Adds a TLS transport so the OpenAI-compatible gateway can reach hosted https://
# providers as well as self-hosted http:// ones. Uses the platform TLS stack
# (schannel/Secure Transport/openssl) via native-tls.
openai-tls = ["openai", "dep:native-tls"]

[lints]
workspace = true
