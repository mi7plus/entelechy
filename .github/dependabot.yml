version: 2
updates:
  # Keep the SHA-pinned GitHub Actions up to date. Dependabot understands
  # commit-SHA pins with a trailing version comment and bumps both the SHA and
  # the comment, so pinning stays enforced while updates stay visible.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    # One grouped PR for routine action bumps rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the Rust dependencies of the Cargo workspace up to date (scans every
  # member's Cargo.toml, including the optional wasmtime / native-tls backends).
  # Each PR is gated by the SHA-pinned, licence-audited CI.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5
    # Lockfile-only: update Cargo.lock to newer compatible versions without
    # touching the manifests' version requirements. The committed Cargo.lock is
    # the source of truth for these updates.
    versioning-strategy: "lockfile-only"
    # One grouped PR for routine lockfile bumps.
    groups:
      cargo:
        patterns:
          - "*"
